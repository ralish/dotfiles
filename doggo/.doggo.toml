# doggo
# https://doggo.mrkaran.dev/docs/
#
# File paths in preference order (macOS):
# - `$XDG_CONFIG_HOME/doggo/config.toml`
#   Only if `$XDG_CONFIG_HOME` is non-empty.
# - `$HOME/Library/Application Support/doggo/config.toml`
# - `$HOME/.doggo.toml`
#
# File paths in preference order (Unix-like):
# - `$XDG_CONFIG_HOME/doggo/config.toml`
#   Only if `$XDG_CONFIG_HOME` is non-empty.
# - `$HOME/.config/doggo/config.toml`
# - `$HOME/.doggo.toml`
#
# File paths in preference order (Windows):
# - `%XDG_CONFIG_HOME%\doggo\config.toml`
#   Only if `%XDG_CONFIG_HOME%` is non-empty.
# - `%APPDATA%\doggo\config.toml`
# - `%USERPROFILE%\.doggo.toml`

# Strategy to query nameservers
strategy = "random"

# vim: syntax=toml cc=80 tw=79 ts=4 sw=4 sts=4 et sr
