# Windows Subsystem for Linux (WSL) per-distribution launch settings
# https://learn.microsoft.com/en-au/windows/wsl/
#
# Last reviewed release: v3.0.1
# File path: `/etc/wsl.conf`
# Initial support: Windows 10 1803

[general]
# Support GUI applications (WSLg)
#
# Default: true
# Support: WSL 0.48.2 (WSL 2 only)
#guiApplications =

[boot]
# Command to run after starting the WSL instance
#
# Default: (empty)
# Support: Windows 11 21H2
#command =

# Use systemd as the system and service manager
#
# Default: false
# Support: WSL 0.65.1 (WSL 2 only)
#systemd =

# Timeout for init daemon, user-session creation, and shutdown (ms)
#
# If set to `0` or a negative value, WSL will not wait on boot and user-session
# creation, and no grace period is provided for the system to perform shutdown.
#
# Only applies when systemd is enabled.
#
# Default: 10000
# Support: WSL 0.68.2 (WSL 2 only)
#initTimeout =

# Protect `binfmt` interpreter from overrides
#
# Only applies when systemd is enabled.
#
# Default: true
# Support: WSL 2.0.0 (WSL 2 only)
#protectBinfmt =

[automount]
# Automatically mount fixed drives
#
# Default: true
# Support: Windows 10 1803
#enabled =

# Process mounts defined in `/etc/fstab`
#
# Default: true
# Support: Windows 10 1803
#mountFsTab =

# Path under which to mount filesystems
#
# Default: /mnt
# Support: Windows 10 1803
#root =

# Default DrvFs mount options
#
# Valid options with defaults:
# - metadata (disabled by default)
#   Enable support for Linux filesystem metadata. The `uid`, `gid`, `umask`,
#   `fmask`, and `dmask` options define the defaults for files without any
#   available metadata.
#
# - case=off
#   Case-sensitivity handling for directories.
#
#   Valid values:
#   - off           Disabled by default
#   - dir           Enabled by default for newly created directories
#   - force         Enabled unconditionally for all directories
#                   Automatically downgraded to `dir` on WSL 2
#
#   For the `off` & `dir` options the per-directory case-sensitivity behaviour
#   is controlled by the `system.wsl_case_sensitive` extended attribute.
#
#   The case-sensitivity EA can be queried and set using `fsutil`:
#   fsutil.exe file queryCaseSensitiveInfo <directory>
#   fsutil.exe file setCaseSensitiveInfo <directory> [enable|disable]
#
#   The legacy `force` option has been replaced with a registry value:
#   Path:   HKLM\System\CurrentControlSet\Services\lxss
#   Name:   DrvFsAllowForceCaseSensitivity
#   Type:   REG_DWORD
#   Value:  1
#
# - uid=<default user ID>
#   Default user ID.
#
# - gid=<default group ID>
#   Default group ID.
#
# - umask=022
#   Octal permissions mask for files & directories.
#
# - fmask=000
#   Octal permissions mask for regular files (logical OR with umask).
#
# - dmask=000
#   Octal permissions mask for directories (logical OR with umask).
#
# Standard mount flags (e.g. `ro`) are accepted on WSL 1 & WSL 2. Any other
# unrecognised option is passed to the underlying filesystem driver: DrvFs on
# WSL 1 (no further options exist), or 9p/VirtioFS on WSL 2 (e.g. `cache=`).
#
# Default: (empty)
# Support: Windows 10 1803
options = "metadata,umask=022,fmask=011"

# Version of cgroups to mount
#
# For cgroups v1 support, the `wsl2.isolateDistroCgroup` global setting must
# also be disabled.
#
# Valid values:
# - v1
# - v2
#
# Default: v2
# Support: WSL 2.6.2 (WSL 2 only)
#cgroups =

# Add WSL shared libraries to the dynamic linker search path
#
# Only applies when GPU support is enabled (i.e. `gpu.enabled`).
#
# Default: true
# Support: Unknown (Inbox release, WSL 2 only)
#ldconfig =

[fileServer]
# Enable the Plan 9 server [UNDOCUMENTED]
#
# Default: true
# Support: Unknown (Inbox release)
#enabled =

# Absolute path to log file for the Plan 9 server [UNDOCUMENTED]
#
# If an empty string, the log file is disabled.
#
# Default: (empty)
# Support: Unknown (Inbox release)
#logFile =

# Minimum severity level of messages to log [UNDOCUMENTED]
#
# Valid values:
# - 0       None
# - 1       Critical
# - 2       Error
# - 3       Warning
# - 4       Information
# - 5       Verbose
#
# Default: 4
# Support: Unknown (Inbox release)
#logLevel =

# Truncate the log file contents on startup [UNDOCUMENTED]
#
# Default: true
# Support: Unknown (Inbox release)
#logTruncate =

[filesystem]
# Permissions mask for session leader (all processes & Plan 9 server)
#
# Default: 0022
# Support: Windows 10 2004
#umask =

[gpu]
# Support accessing the host GPU using paravirtualisation
#
# Default: true
# Support: Windows 11 21H2 (WSL 2 only)
#enabled =

# Append the WSL libraries path to `$PATH`
#
# WSL libraries are mounted in the instance at `/usr/lib/wsl/lib`.
#
# Only applies when GPU paravirtualisation is enabled.
#
# Default: true
# Support: Unknown (Inbox release, WSL 2 only)
#appendLibPath =

[interop]
# Support launching Windows processes
#
# Default: true
# Support: Windows 10 1809
#enabled =

# Add Windows path elements to `$PATH`
#
# Default: true
# Support: Windows 10 1809
appendWindowsPath = false

[network]
# Hostname for WSL instance
#
# If unset, defaults to the Windows hostname.
#
# Default: (unset)
# Support: Unknown (Inbox release)
#hostname =

# Generate `/etc/hosts`
#
# Default: true
# Support: Windows 10 1803
#generateHosts =

# Generate `/etc/resolv.conf`
#
# Default: true
# Support: Windows 10 1803
#generateResolvConf =

[time]
# Use and synchronise with the Windows timezone
#
# Default: true
# Support: Unknown (Inbox release)
#useWindowsTimezone =

[user]
# Default user when starting a session
#
# An empty string defaults to the initial user created on installation.
#
# Default: (empty)
# Support: Windows 10 2004
#default =

